name: Обновление каталога

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка библиотек
        run: pip install requests beautifulsoup4

      - name: Список товаров из карты сайта
        working-directory: catalog-tools
        run: python collect_urls.py

      - name: Названия товаров выбранного раздела
        working-directory: catalog-tools
        env:
          CATALOG_PREFIX: "krepej_i_takelaj/samorezy_shurupy"
          CATALOG_LIMIT: "0"
          MAX_SECONDS: "300"
        run: python build_catalog.py

      - name: Сохранение результата
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog-tools/catalog.csv catalog-tools/product_urls.csv
          git commit -m "Обновление каталога" || exit 0
          git push
